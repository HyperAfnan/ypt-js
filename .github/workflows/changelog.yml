name: Generate Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - "CHANGELOG.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Generate Changelog and Open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Create Pull Request for Changelog
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(changelog): auto-update CHANGELOG.md"
          title: "chore(changelog): auto-update CHANGELOG.md"
          body: |
            Automated update to `CHANGELOG.md` generated by [git-cliff](https://git-cliff.org/).
          branch: "chore/update-changelog"
          base: "main"
          delete-branch: true
