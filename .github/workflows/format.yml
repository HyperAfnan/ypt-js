name: Auto Format

on:
  push:
    paths-ignore:
      - "bun.lock"
      - ".git/**"

permissions:
  contents: write

jobs:
  format:
    name: Prettier Auto-Format
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Prettier
        run: bun run format

      - name: Commit and push formatted code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format code with prettier [skip ci]"
          branch: ${{ github.ref_name }}
