name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (simulate without publishing)"
        required: false
        default: false
        type: boolean

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify formatting
        run: bun run format:check

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

      - name: Verify NPM_TOKEN configuration
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::Secret NPM_TOKEN is missing! Please configure NPM_TOKEN in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Configure npm credentials
        run: |
          TOKEN="${{ secrets.NPM_TOKEN }}"
          if [ -z "$TOKEN" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            TOKEN="npm_dummy_token_for_dry_run"
          fi
          echo "//registry.npmjs.org/:_authToken=${TOKEN}" > ~/.npmrc

      - name: Publish package
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Running bun publish in dry-run mode..."
            bun publish --dry-run --access public
          else
            echo "Publishing package to npmjs..."
            bun publish --access public --tolerate-republish
          fi
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
